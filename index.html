<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- seo:start -->
    <!--
      Bloc remplacé au build par scripts/prerender.mjs, qui écrit le <head>
      complet de chaque langue (title, description, canonical, hreflang, Open
      Graph, JSON-LD) à partir de src/i18n/content.js et src/seo/.
      Ce qui suit ne sert qu'au serveur de dev.
    -->
    <title>Dawensky Thermildort</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#1A1A1A" />
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link
      href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap"
      rel="stylesheet"
    />
    <!-- seo:end -->

    <!--
      Le HTML pré-rendu porte les styles initiaux de Framer Motion
      (opacity: 0). Sans JavaScript, rien ne viendrait les lever : ce bloc
      rend le contenu visible pour les visiteurs et robots sans JS.
    -->
    <noscript>
      <style>
        [style*="opacity:0"],
        [style*="opacity: 0"] {
          opacity: 1 !important;
          transform: none !important;
          filter: none !important;
        }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
